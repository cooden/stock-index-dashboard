<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>股票指数实时看板</title>
  <link rel="stylesheet" href="style.css?v=20260930b" />
</head>
<body>
  <!-- 顶部栏 -->
  <header class="topbar">
    <div class="brand">
      <span class="logo">📈</span>
      <div>
        <h1>股票指数实时看板</h1>
        <p class="sub">上证 · 中证全指 · 创业板指 · 科创50 · 日经225 · 韩国KOSPI</p>
      </div>
    </div>
    <div class="top-actions">
      <div class="src-ctrl">
        <label class="src-label">数据源</label>
        <select id="srcSelect" title="切换行情数据来源"></select>
        <button id="healthBtn" class="btn ghost" title="探测各数据源健康状态">健康检测</button>
      </div>
      <div id="refreshBadge" class="refresh-badge">--</div>
      <button id="grayBtn" class="btn ghost" title="灰白模式(上班不显眼)">🌙 灰白</button>
    </div>
  </header>

  <!-- 数据源状态条 -->
  <section id="sourceBar" class="source-bar"></section>

  <main class="container">
    <!-- 实时指数 + 成交额 + 进度条 合并为一个 block, 信息更集中 -->
    <section class="block main-block">
      <div class="block-head">
        <h2>实时指数</h2>
        <span id="idxTime" class="meta-time"></span>
      </div>
      <div id="indexGrid" class="index-grid">
        <div class="loading">加载中…</div>
      </div>

      <!-- 成交额(无标题, 仅数值 + 小字说明) -->
      <div id="turnover" class="turnover-wrap">加载中…</div>

      <!-- 涨跌家数进度条 -->
      <div id="breadthBar" class="breadth-bar">
        <div class="bar-green" style="width:50%"></div>
        <div class="bar-red" style="width:50%"></div>
      </div>
    </section>

  </main>

  <!-- 悬浮侧边栏: A股涨跌幅排名 + 基金排行 -->
  <aside class="rank-sidebar">
    <div class="block-head">
      <h2>A股涨跌幅排名</h2>
      <span class="meta-tip">从高到低</span>
    </div>
    <div id="rankList" class="rank-list">加载中…</div>

    <div class="block-head" style="margin-top: 18px;">
      <h2>基金涨幅榜</h2>
      <span class="meta-tip">近6月Top3 · ETF</span>
    </div>
    <div id="fundList" class="rank-list fund-list">加载中…</div>
  </aside>

  <!-- 赞助模块 -->
  <section class="block sponsor-block">
    <div class="block-head">
      <h2>请作者喝杯咖啡 ☕</h2>
      <span class="meta-tip">你的鼓励是持续更新的动力</span>
    </div>
    <div class="sponsor-wrap">
      <div class="sponsor-qr">
        <img src="sponsor-qr.png" alt="微信收款码" />
      </div>
      <div class="sponsor-tip">
        <p>如果这个看板对你有帮助,<br>欢迎随意打赏,金额不限 👍</p>
      </div>
    </div>
  </section>

  <footer class="footer">
    <span>数据仅供学习参考,不构成投资建议。 © 2026 股票指数看板</span>
  </footer>

  <script src="app.js?v=20260930b"></script>
</body>
</html>
